services:
  mysql:
    image: mysql:8.0
    container_name: openmarket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - openmarket-net
  
  redis:
    image: redis:7.2
    container_name: openmarket-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./docker/data/redis:/data
    environment:
      TZ: ${TZ}
    networks:
      - openmarket-net
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: openmarket-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: ${TZ}
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    networks:
      - openmarket-net
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: openmarket-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # 외부(Localhost)와 내부(Docker Network) 접근 주소 분리
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      TZ: ${TZ}
    networks:
      - openmarket-net

networks:
  openmarket-net:
    driver: bridge