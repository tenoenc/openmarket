bootJar { enabled = false }
jar { enabled = true }

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:mysql'
    testFixturesApi 'org.testcontainers:junit-jupiter'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesApi 'com.mysql:mysql-connector-j'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-redis'
    testFixturesApi platform('software.amazon.awssdk:bom:2.41.31')
    testFixturesApi 'software.amazon.awssdk:s3'
    testFixturesApi "org.testcontainers:localstack"
    testFixturesApi 'org.flywaydb:flyway-core'
    testFixturesApi 'org.flywaydb:flyway-mysql'
    testFixturesApi 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.data:spring-data-jpa'
    implementation 'jakarta.persistence:jakarta.persistence-api'
}